name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      all_versions:
        description: 'Check all Minecraft ports for a major release'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: targets
        name: Select primary build or major release matrix
        env:
          ALL_VERSIONS: ${{ inputs.all_versions || false }}
        run: |
          node -e 'const fs=require("fs"); const targets=require("./fabric-mod/versions.json"); const policy=require("./fabric-mod/release-policy.json"); const names=process.env.ALL_VERSIONS==="true"?Object.keys(targets):[policy.primaryMinecraft]; const include=names.flatMap(minecraft=>["baseline","current"].map(profile=>({minecraft,java:targets[minecraft].java,profile}))); fs.appendFileSync(process.env.GITHUB_OUTPUT,"matrix="+JSON.stringify({include})+"\n")'

  test:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}
    name: Minecraft ${{ matrix.minecraft }} / Fabric ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Java 21 for older Minecraft tests
        if: matrix.java == 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Java 25 for Gradle and modern Minecraft
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and package baseline dependencies
        if: matrix.profile == 'baseline'
        working-directory: fabric-mod
        run: ./gradlew --no-daemon test packageRelease -PmcTarget=${{ matrix.minecraft }}
      - name: Build and test current Fabric dependencies
        if: matrix.profile == 'current'
        working-directory: fabric-mod
        run: ./gradlew --no-daemon test build -PmcTarget=${{ matrix.minecraft }} -PfabricProfile=current
      - name: Upload versioned JAR and checksum
        if: matrix.profile == 'baseline'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CraftGPT-mc${{ matrix.minecraft }}
          path: releases/*/*-mc${{ matrix.minecraft }}.jar*
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tests-mc${{ matrix.minecraft }}-${{ matrix.profile }}
          path: |
            fabric-mod/build/${{ matrix.minecraft }}/**/test-results/test/*.xml
            fabric-mod/build/${{ matrix.minecraft }}/**/reports/tests/test/**
          if-no-files-found: warn

  portable-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check portable preview
        working-directory: fabric-mod
        run: node tools/test-portable-viewer.cjs
