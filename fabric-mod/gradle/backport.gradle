['main', 'client', 'test'].each { name ->
    def sources = sourceSets[name].java.srcDirs.toList()
    def output = layout.buildDirectory.dir("generated/backport/${name}")
    def generate = tasks.register("prepare${name.capitalize()}Backport", Sync) {
        from(sources)
        if (oldest && name == 'main') exclude('dev/craftgpt/item/CraftGptItems.java', 'dev/craftgpt/item/CraftBookItem.java')
        into(output)
        filteringCharset = 'UTF-8'
        inputs.property('renames', renames)
        inputs.file('gradle/backport.gradle')
        filter { line ->
            renames.each { oldName, newName -> line = line.replace(oldName, newName) }
            line = line.replaceAll(/\b(g|graphics)\.text\(/, '$1.drawString(')
            line = line.replaceAll(/\b(g|graphics)\.centeredText\(/, '$1.drawCenteredString(')
            line
        }
    }
    sourceSets[name].java.setSrcDirs([output])
    tasks.named(sourceSets[name].compileJavaTaskName).configure { dependsOn(generate) }
    tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn(generate) }
}
